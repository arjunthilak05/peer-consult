name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          PYTHONDONTWRITEBYTECODE: "1"

  office-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: office-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: office-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Committed office bundle is up to date
        run: |
          git status --porcelain -- ../peer_consult/office_dist
          git diff --exit-code --stat -- ../peer_consult/office_dist || {
            echo "::error::peer_consult/office_dist is stale. Run 'npm run build' in office-ui/ and commit the result."
            exit 1
          }
          test -z "$(git status --porcelain -- ../peer_consult/office_dist)"

  e2e:
    runs-on: ubuntu-latest
    needs: office-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: office-ui/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - working-directory: office-ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          PEER_CONSULT_PYTHON: python
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: office-ui/test-results
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv and smoke-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/peer-consult --version
          /tmp/clean/bin/peer-consult setup --home /tmp/fake-home --dry-run
          /tmp/clean/bin/peer-consult setup --home /tmp/fake-home
          test -f /tmp/fake-home/.claude/skills/ask-codex/SKILL.md
          grep -q -- '-I -m peer_consult ask --caller claude --target codex' /tmp/fake-home/.claude/skills/ask-codex/SKILL.md
          /tmp/clean/bin/python -I -c "import peer_consult.office_server as o; d = o.find_office_dist(); assert d and (d / 'index.html').is_file(), d; print(d)"
          /tmp/clean/bin/peer-consult uninstall --home /tmp/fake-home
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
