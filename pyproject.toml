[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license-files
build-backend = "hatchling.build"

[project]
name = "peer-consult"
dynamic = ["version"]
description = "Bounded, read-only second opinions and a three-agent council for Claude Code, OpenAI Codex CLI and Google Antigravity CLI (agy)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [{ name = "peer-consult contributors" }]
keywords = [
    "claude-code", "codex", "antigravity", "gemini", "ai-agents", "multi-agent",
    "code-review", "second-opinion", "council", "llm", "skills",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "pydantic>=2.6,<3",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "build>=1.2",
    "twine>=6.1",
]

[project.scripts]
peer-consult = "peer_consult.cli:main"

[project.urls]
Homepage = "https://github.com/arjunthilakeros/peer-consult"
Repository = "https://github.com/arjunthilakeros/peer-consult"
Issues = "https://github.com/arjunthilakeros/peer-consult/issues"
Changelog = "https://github.com/arjunthilakeros/peer-consult/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "peer_consult/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["peer_consult"]
# The office UI bundle is a build artifact; include it even if a local .gitignore hides it.
artifacts = ["peer_consult/office_dist/**"]

[tool.hatch.build.targets.sdist]
include = [
    "/peer_consult",
    "/tests",
    "/office-ui",
    "/docs/*.md",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
]
exclude = [
    "/office-ui/node_modules",
    "/office-ui/test-results",
    "/office-ui/playwright-report",
    "**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["office-ui", "peer_consult/office_dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
    "E501",   # long lines in argv tables and messages are clearer unwrapped
    "B008",   # Typer's Annotated/Option defaults
    "B904",   # exceptions are re-raised as typed ProviderError/RequestError with the cause in the message
    "UP007",  # Optional[...] is required by Typer on 3.11 for some option types
    "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
